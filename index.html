        const themes = {
            'modern-dark': {

                titleFont: 'font-display',

                tileBg: 'bg-orange-50 border-orange-200 shadow-sm',
                titleFont: 'font-display',
                bodyFont: 'font-sans',
                glowEffect: 'bg-radial-gradient from-rose-100/30 to-transparent',
                borderLeft: 'border-l-4 border-rose-500'
            }
        };

        // Render Slide List in Left Sidebar
        function renderSlideList() {
            const container = document.getElementById('slideThumbnails');
            container.innerHTML = '';
            
            presentationData.forEach((slide, i) => {
                const isActive = i === activeSlideIndex;
                const activeClasses = isActive ? 'border-blue-500 bg-slate-850' : 'border-slate-800 hover:bg-slate-850';
                
                let iconClass = 'fa-heading';
                if (slide.layout === 'Tiled_Text_With_Icons') iconClass = 'fa-cubes';
                else if (slide.layout === 'Two_Column_Tiled_Text') iconClass = 'fa-columns';
                else if (slide.layout === 'Highlighted_Numbers') iconClass = 'fa-arrow-up-right-dots';
                else if (slide.layout === 'Quote') iconClass = 'fa-quote-left';
                else if (slide.layout === 'Q&A') iconClass = 'fa-circle-question';

                container.innerHTML += `
                    <div onclick="selectSlide(${i})" class="group cursor-pointer border rounded-xl p-3 flex items-center gap-3 transition ${activeClasses}">
                        <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center border border-slate-700/50 group-hover:border-blue-500/50 transition">
                            <i class="fa-solid ${iconClass} text-xs text-blue-400"></i>
                        </div>
                        <div class="flex-grow min-w-0">
                            <span class="text-[10px] font-semibold block text-slate-500">Slide ${i + 1}</span>
                            <span class="text-xs text-slate-200 truncate block font-medium pr-2">${slide.title || 'Tanpa Judul'}</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('slideCountLabel').innerText = `${presentationData.length} Slide`;
        }

        // Active Theme Indicator Sync
        function updateThemeSelectorUI() {
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'border-2');
                btn.classList.add('border-slate-800');
            });
            const activeBtn = document.querySelector(`[onclick="setTheme('${currentTheme}')"]`);
            if (activeBtn) {
                activeBtn.classList.remove('border-slate-800');
                activeBtn.classList.add('border-blue-500', 'border-2');
            }
        }

        // Change global presentation theme
        function setTheme(themeName) {
            currentTheme = themeName;
            updateThemeSelectorUI();
            renderActiveSlide();
        }

        // Handle text edit blur updates
        function saveText(slideIdx, field, value, optIndex = null) {
            if (optIndex !== null) {
                presentationData[slideIdx].points[optIndex][field] = value;
            } else {
                presentationData[slideIdx][field] = value;
            }
            // Update left panel to capture updated title live
            renderSlideList();
        }

        // Core Render Engine
        function renderActiveSlide(targetContainerId = 'slideBody', isFullView = false, forceSlideIdx = null) {
            const index = forceSlideIdx !== null ? forceSlideIdx : activeSlideIndex;
            const slide = presentationData[index];
            const t = themes[currentTheme];

            reader.readAsText(file);

    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        
        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            document.getElementById('slideIndicator').innerText = (index + 1) + ' / ' + slides.length;
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                showSlide(currentIndex);
            }
        }

        function nextSlide() {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                showSlide(currentIndex);
            }
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Arrow Key & Space Bar listeners
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
    <\/script>
</body>
